name: Build DA Manager EXE

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:   # ให้กด Run workflow จาก GitHub ได้เอง

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + electron
        run: npm run build

      - name: Build Windows EXE (portable + installer)
        run: npx electron-builder --win --x64

      - name: List release files
        run: dir release
        shell: cmd

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DA-Manager-Windows
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: warn
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + electron
        run: npm run build

      - name: Build Linux AppImage
        run: npx electron-builder --linux AppImage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DA-Manager-Linux
          path: release/*.AppImage
          if-no-files-found: warn
          retention-days: 30

  # สร้าง GitHub Release อัตโนมัติเมื่อ push tag เช่น v1.2.0
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: DA-Manager-Windows
          path: release-win

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: DA-Manager-Linux
          path: release-linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-win/*
            release-linux/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
